name: iOS CI

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - 'docs/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ios/**'
      - 'docs/**'
      - '.github/workflows/ios.yml'

jobs:
  test-ios:
    name: Build & Test iOS Native
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Run Swift Package Tests
        run: |
          cd ios
          swift test --parallel --enable-code-coverage || (echo "Test failed, diagnostic reports:" && ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null && for f in ~/Library/Logs/DiagnosticReports/*; do echo "=== $f ==="; cat "$f" 2>/dev/null; done; exit 1)

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-coverage
          path: ios/.build/
